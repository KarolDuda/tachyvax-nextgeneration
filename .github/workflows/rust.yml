name: Rust core (recode)

on:
  push:
    branches: [recode]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test neox-core
        run: cargo test --all-targets
