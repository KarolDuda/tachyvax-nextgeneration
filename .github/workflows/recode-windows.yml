name: NEOX RECODE (Windows build)
on:
  workflow_dispatch:
  push:
    branches: [recode]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      NEOX_VERSION: 3.1.${{ github.run_number }}
      # License server URL (repository secret). Baked into the exe at build time; never stored in the repo.
      NEOX_ACTIVATION_URL: ${{ secrets.NEOX_ACTIVATION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test core and system layers (Windows)
        run: cargo test --all-targets

      - name: Build the app (release)
        run: cargo build --release -p neox-app

      - name: Stage files for the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item target\release\neox.exe publish\Neox.exe
          Get-ChildItem publish | Format-Table Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=3.1.${{ github.run_number }} installer\neox.iss'

      - name: Checksum and build provenance
        shell: pwsh
        run: |
          $h = (Get-FileHash installer\output\Neox_Setup.exe -Algorithm SHA256).Hash
          $e = (Get-FileHash publish\Neox.exe -Algorithm SHA256).Hash
          @"
          NEOX 3.1.${{ github.run_number }} (Rust + Tauri). Download Neox_Setup.exe and run it. Installed copies update themselves from Settings, Check for updates.

          The installer is not code-signed, so SmartScreen / Smart App Control may warn you. It is built by GitHub Actions from this repository's source; verify it with ``gh attestation verify Neox_Setup.exe --repo KarolDuda/NEOX``.

          SHA-256 Neox_Setup.exe: ``$h``
          SHA-256 Neox.exe: ``$e``
          "@ | Set-Content -Encoding utf8 release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: installer/output/Neox_Setup.exe

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # The in-app updater reads the version from the tag, so it must look like v3.1.N.
          tag_name: v3.1.${{ github.run_number }}
          name: NEOX 3.1.${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: installer/output/Neox_Setup.exe
          body_path: release-notes.md
